trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
- group: gallery-app-secrets

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Use Node.js 18'

    # Install backend dependencies
    - script: |
        cd backend
        npm install --production
      displayName: 'Install backend dependencies'

    # Build frontend
    - script: |
        cd frontend
        npm install
        npm run build
      displayName: 'Build frontend'

    # Archive frontend
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'frontend/build'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
      displayName: 'Archive frontend build'

    # Archive backend AFTER install
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'backend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
      displayName: 'Archive backend'

    # Publish artifacts
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      displayName: 'Publish artifacts'

- stage: DeployBackend
  dependsOn: Build
  jobs:
  - deployment: DeployBackendJob
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'db2'
              appName: 'dbcw'
              appType: webAppLinux
              package: '$(Pipeline.Workspace)/drop/backend.zip'
            displayName: 'Deploy backend to App Service'
